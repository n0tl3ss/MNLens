<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/mnlens-logo.png?v=5" />
    <title>MNLens</title>
    <style>
      :root {
        color-scheme: dark;
        background: #07131c;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 12%, rgba(21, 155, 211, 0.34), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(102, 87, 255, 0.28), transparent 28%),
          radial-gradient(circle at 58% 84%, rgba(17, 191, 165, 0.22), transparent 32%),
          linear-gradient(135deg, #07131c 0%, #0b1d2c 54%, #09151f 100%);
      }

      #root:empty,
      .boot-screen {
        min-height: 100vh;
      }

      .boot-screen {
        display: grid;
        place-items: center;
        color: #eefbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-card {
        width: min(420px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .boot-mark {
        width: 118px;
        height: 118px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 26px 70px rgba(21, 155, 211, 0.36));
      }

      .boot-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .boot-card h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .boot-card p {
        margin: 0;
        color: #a9c7d4;
        font-size: 14px;
      }

      .boot-bar {
        width: 100%;
        height: 7px;
        overflow: hidden;
        border: 1px solid rgba(133, 230, 255, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #11bfa5, #27b7f2, #6657ff);
        animation: boot-load 1.35s ease-in-out infinite;
      }

      @keyframes boot-load {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <main class="boot-card">
          <div class="boot-mark" aria-hidden="true"><img src="/mnlens-logo.png?v=5" alt="" /></div>
          <div>
            <h1>MNLens</h1>
            <p>Loading review workspace</p>
          </div>
          <div class="boot-bar" aria-label="Loading"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
