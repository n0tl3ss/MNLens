<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/mnlens-logo.svg" />
    <title>MNLens</title>
    <script>
      // Apply the saved theme before first paint so the boot screen and the app never flash the other theme.
      (function () {
        var theme = "light";
        try {
          theme = localStorage.getItem("mnlens-theme") === "dark" ? "dark" : "light";
        } catch (error) {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --boot-bg: #e7e8e3;
        --boot-ink: #20292d;
        --boot-muted: #5f6a6e;
        --boot-track: #d3d5cd;
        --boot-bar: #2a7a93;
        background: var(--boot-bg);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --boot-bg: #1b1e21;
        --boot-ink: #e8ebec;
        --boot-muted: #9aa4a9;
        --boot-track: #30363b;
        --boot-bar: #6fb3cc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--boot-bg);
      }

      #root:empty,
      .boot-screen {
        min-height: 100vh;
      }

      .boot-screen {
        display: grid;
        place-items: center;
        color: var(--boot-ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-card {
        width: min(360px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .boot-mark {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
      }

      .boot-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .boot-card h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }

      .boot-card p {
        margin: 4px 0 0;
        color: var(--boot-muted);
        font-size: 14px;
      }

      .boot-bar {
        width: 100%;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-track);
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-bar);
        animation: boot-load 1.35s ease-in-out infinite;
      }

      @keyframes boot-load {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <main class="boot-card">
          <div class="boot-mark" aria-hidden="true"><img src="/mnlens-logo.svg" alt="" /></div>
          <div>
            <h1>MNLens</h1>
            <p>Loading review workspace</p>
          </div>
          <div class="boot-bar" aria-label="Loading"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
